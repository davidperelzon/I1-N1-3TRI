{% extends 'catalogo/base.html' %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<h2>{{ titulo }}</h2>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Salvar</button>
</form>

{% if bolo %}
<p><a href="{% url 'catalogo:detalhe_bolo' bolo.pk %}">Cancelar</a></p>
{% else %}
<p><a href="{% url 'catalogo:lista_bolos' %}">Cancelar</a></p>
{% endif %}
{% endblock %}
